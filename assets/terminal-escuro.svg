<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="Terminal: bruno schmidt — dev de software @ paraíso/sc; codando há 5 anos, load average: café, café, café; side-projects  academia  música  jogos; 2.249  # e contando">
<style>
  .cmd{font:600 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#f0b429}
  .out{font:14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#e6edf3}
  .digita{transform-box:fill-box;transform-origin:left;animation-name:enche;animation-fill-mode:backwards}
  .aparece{animation:aparece .2s backwards}
  .cursor{animation:pisca 1s steps(1) infinite}
  @keyframes enche{from{transform:scaleX(0)}}
  @keyframes aparece{from{opacity:0}}
  @keyframes pisca{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.digita,.aparece,.cursor{animation:none}}
</style>
<rect x="0.5" y="0.5" width="859" height="249" rx="12" fill="#161b22" stroke="#30363d"/>
<circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
<text x="430" y="24" text-anchor="middle" style="font:12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#8b949e">bruno@paraiso: ~</text>
<g>
      <clipPath id="c0"><rect x="24" y="44" height="20" width="71.2" class="digita" style="animation-delay:0.30s;animation-duration:0.36s;animation-timing-function:steps(8)"/></clipPath>
      <text x="24" y="58" class="cmd" clip-path="url(#c0)">$ whoami</text>
      <text x="24" y="78" class="out aparece" style="animation-delay:1.01s">bruno schmidt — dev de software @ paraíso/sc</text>
    </g><g>
      <clipPath id="c1"><rect x="24" y="88" height="20" width="71.2" class="digita" style="animation-delay:1.26s;animation-duration:0.36s;animation-timing-function:steps(8)"/></clipPath>
      <text x="24" y="102" class="cmd" clip-path="url(#c1)">$ uptime</text>
      <text x="24" y="122" class="out aparece" style="animation-delay:1.97s">codando há 5 anos, load average: café, café, café</text>
    </g><g>
      <clipPath id="c2"><rect x="24" y="132" height="20" width="180.4" class="digita" style="animation-delay:2.22s;animation-duration:0.94s;animation-timing-function:steps(21)"/></clipPath>
      <text x="24" y="146" class="cmd" clip-path="url(#c2)">$ ps aux | grep bruno</text>
      <text x="24" y="166" class="out aparece" style="animation-delay:3.51s">side-projects  academia  música  jogos</text>
    </g><g>
      <clipPath id="c3"><rect x="24" y="176" height="20" width="289.6" class="digita" style="animation-delay:3.76s;animation-duration:1.53s;animation-timing-function:steps(34)"/></clipPath>
      <text x="24" y="190" class="cmd" clip-path="url(#c3)">$ git log --since=&#34;1 year&#34; | wc -l</text>
      <text x="24" y="210" class="out aparece" style="animation-delay:5.64s">2.249  # e contando</text>
    </g>
<text x="24" y="234" class="cmd">$ <tspan class="cursor">▋</tspan></text>
</svg>